<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - ePlus</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/selectric.css" />
    <link
      rel="stylesheet"
      href="//cdn.datatables.net/2.3.5/css/dataTables.dataTables.min.css"
    />
    <link rel="stylesheet" href="./assets/css/main.css" />
  </head>
  <body>
    <div class="page_wrap feeDetailPageWrap">
      <div id="toastContainer"></div>
      <div class="eContainer">
        <div class="sideBar"></div>
        <div class="mainArticle">
          <div class="cardsWrap">
            <div class="cardsWrap_header">
              <div class="sectionWrap">
                <h3>Fee Structure Details</h3>
                <p>
                  <span id="stdHolder"></span> (<span id="acaYearHolder"></span
                  >)
                </p>
              </div>
              <div class="actionBtns">
                <div class="inputWrap btnWrap d-flex gap-2">
                  <button type="button" class="mBtn" id="updateBtn">
                    Update
                  </button>
                  <button type="button" class="mBtn dangerBtn" id="deleteBtn">
                    Delete
                  </button>
                </div>
              </div>
            </div>
            <table id="feeStructTable" class="mTable">
              <thead>
                <tr>
                  <th>Fee Type</th>
                  <th>Total Amount</th>
                  <th>Academic Year</th>
                </tr>
              </thead>
              <tbody>
                <!-- JS will populate -->
              </tbody>
            </table>
          </div>
          <div class="calfacWrap">
            <div class="calfacWrap_table">
              <div class="cardsWrap_header">
                <div class="sectionWrap">
                  <h3>Term Breakdown</h3>
                </div>
              </div>

              <table id="feeBreakDownTable" class="mTable">
                <thead>
                  <tr>
                    <th>Term Name</th>
                    <th>Amount</th>
                    <th>Due Date</th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- JS will populate -->
                </tbody>
              </table>
            </div>
          </div>
          <div class="cardsWrap">
            <div class="cardsWrap_inner">
              <div class="cardsWrap_item">
                <div class="cardsWrap_item_details">
                  <p>Total Amount</p>
                  <h2 id="totalAmount">0</h2>
                </div>
                <div class="cardsWrap_item_icon">₹</div>
              </div>
              <div class="cardsWrap_item">
                <div class="cardsWrap_item_details">
                  <p>Paid</p>
                  <h2 id="paidAmount">0</h2>
                </div>
                <div class="cardsWrap_item_icon">✓</div>
              </div>
              <div class="cardsWrap_item">
                <div class="cardsWrap_item_details">
                  <p>Pending</p>
                  <h2 id="pendingAmount">0</h2>
                </div>
                <div class="cardsWrap_item_icon">⏱</div>
              </div>
              <div class="cardsWrap_item">
                <div class="cardsWrap_item_details">
                  <p>Total Concession</p>
                  <h2 id="concessionAmount">0</h2>
                </div>
                <div class="cardsWrap_item_icon">%</div>
              </div>
            </div>
          </div>
          <div class="calfacWrap">
            <div class="calfacWrap_table">
              <div class="cardsWrap_header">
                <div class="sectionWrap">
                  <h3>Students Enrolled</h3>
                </div>
                <div class="filterWrap inputWrap">
                  <button type="button" class="mBtn" id="allCountBtn">
                    ALL (<span id="allCount">0</span>)
                  </button>
                  <button type="button" class="mBtn" id="paidCountBtn">
                    Paid (<span id="paidCount">0</span>)
                  </button>
                  <button type="button" class="mBtn" id="pendingCountBtn">
                    Pending (<span id="pendingCount">0</span>)
                  </button>
                  <button type="button" class="mBtn" id="partialCountBtn">
                    Partial (<span id="partialCount">0</span>)
                    </button>

                  <input
                    type="search"
                    name=""
                    id="studentSearch"
                    placeholder="Search Here...."
                  />
                </div>
              </div>

              <table id="studentFeesTable" class="mTable">
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>Total Amount</th>
                    <th>Paid</th>
                    <th>Concession</th>
                    <th>Pending</th>
                    <th>Status</th>
                    <th>Last Payment</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- JS will populate -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <!-- /MODAL -->

      <!-- Modal -->
      <div
        class="modal fade"
        id="stuDeleteModalCenter"
        data-bs-backdrop="static"
        data-bs-keyboard="false"
        tabindex="-1"
        aria-labelledby="staticBackdropLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="stuDeleteModalLongTitle">
                Delete Student
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="modalForm">
                <form action="" method="post" id="studentForm">
                  <div class="inputWrap btnWrap">
                    <label for="delText"
                      >Please enter
                      <span style="color: red; font-weight: 600"> DELETE </span
                      >to confirm</label
                    >
                    <input
                      type="text"
                      id="delText"
                      placeholder="Please Enter"
                      autocomplete="off"
                    />
                  </div>
                  <div class="inputWrap btnWrap mt-4 flexEnd">
                    <button
                      type="button"
                      class="mBtn dangerBtn"
                      id="addStudentDeleteBtn"
                    >
                      Confirm
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function checkAuth() {
        const isLoggedIn = localStorage.getItem("isLoggedIn");
        const token = localStorage.getItem("token");

        if (isLoggedIn != "true" || !token) {
          window.location.replace("index.html");
        }
      })();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="//cdn.datatables.net/2.3.5/js/dataTables.min.js"></script>
    <script src="./assets/js/sidebar-loader.js"></script>
    <script src="./assets/js/jquery.selectric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/main.js"></script>
    <script>
$(document).ready(function () {

  /* =========================
     URL PARAMS
  ========================= */
  const urlParams = new URLSearchParams(window.location.search);
  const standardId = urlParams.get("standard_id");
  const feeStructureId = urlParams.get("fee_structure");

  if (!standardId || !feeStructureId) {
    showToast("Required parameters missing", "error");
    return;
  }

  /* =========================
     DELETE MODAL
  ========================= */
  $("#deleteBtn").on("click", function () {
    $("#stuDeleteModalCenter").modal("show");
  });

  /* =========================
     LOAD FEE STRUCTURE DETAILS
  ========================= */
  $.ajax({
    url: `${API_URL}/api/adminServices/fee-structures/${feeStructureId}`,
    type: "GET",
    headers: { Authorization: `Bearer ${authToken}` },
    success: function (res) {
      const fee = res.data.fee_structure;
      const terms = res.data.terms || [];

      $("#stdHolder").text(`STD ${fee.standard_id}`);
      $("#acaYearHolder").text(`AY ${fee.academic_year_id}`);

      $("#feeStructTable tbody").html(`
        <tr>
          <td>${fee.fee_type}</td>
          <td>${fee.amount}</td>
          <td>${fee.academic_year_id}</td>
        </tr>
      `);

      const termBody = $("#feeBreakDownTable tbody").empty();
      terms.length
        ? terms.forEach(t => termBody.append(`
            <tr>
              <td>${t.term_name}</td>
              <td>${t.amount}</td>
              <td>${new Date(t.due_date).toLocaleDateString()}</td>
              <td>${t.description || "-"}</td>
            </tr>
          `))
        : termBody.append(`<tr><td colspan="4">No terms found</td></tr>`);
    }
  });

  /* =========================
     GLOBAL FILTER STATE
  ========================= */
  let studentFeesTable;
  let studentFeeFilters = {
    academic_year_id: 1,
    search: "",
    payment_status: ""
  };

  /* =========================
     INIT STUDENT FEES TABLE
  ========================= */
  studentFeesTable = new DataTable("#studentFeesTable", {
    processing: true,
    serverSide: true,
    searching: false,
    ordering: false,
    lengthChange: false,
    pageLength: pageLimit,

    ajax: function (data, callback) {

      const page = Math.floor(data.start / data.length) + 1;
      const limit = data.length;

      const qs = new URLSearchParams({
        academic_year_id: studentFeeFilters.academic_year_id,
        page,
        limit
      });

      if (studentFeeFilters.search)
        qs.append("search", studentFeeFilters.search);

      if (studentFeeFilters.payment_status)
        qs.append("payment_status", studentFeeFilters.payment_status);

      $.ajax({
        url: `${API_URL}/api/adminServices/student-fees/${standardId}/student-fees?${qs}`,
        type: "GET",
        headers: { Authorization: `Bearer ${authToken}` },
        success: function (res) {
          const d = res.data;

          /* SUMMARY CARDS */
          $("#totalAmount").text(d.summary.total_amount);
          $("#paidAmount").text(d.summary.collected_amount);
          $("#pendingAmount").text(d.summary.pending_amount);
          $("#concessionAmount").text(d.summary.concession_amount);

          /* FILTER COUNTS */
          $("#allCount").text(d.status_counts.total_students);
          $("#paidCount").text(d.status_counts.paid_count);
          $("#pendingCount").text(d.status_counts.pending_count);
          $("#partialCount").text(d.status_counts.partial_count);

          callback({
            draw: data.draw,
            recordsTotal: d.pagination.total_records,
            recordsFiltered: d.pagination.total_records,
            data: d.students || []
          });
        }
      });
    },

    columns: [
      {
        data: "student_name",
                render: (d, t, r) =>
                `<strong>${d}</strong><br><small>${r.registration_number}</small>`
            },
            { data: null, render: r => r.terms.reduce((s, t) => s + t.term_amount, 0) },
            { data: null, render: r => r.terms.reduce((s, t) => s + t.paid_amount, 0) },
            { data: null, render: r => r.terms.reduce((s, t) => s + t.concession_amount, 0) },
            { data: null, render: r => r.terms.reduce((s, t) => s + t.pending_amount, 0) },
            {
        data: null,
        render: r => {
            const statuses = r.terms.map(t => t.payment_status);

            const allPaid = statuses.every(s => s === "paid");
            const allPending = statuses.every(s => s === "pending");

            if (allPaid) {
            return `<span class="badge badge-success">Paid</span>`;
            }

            if (allPending) {
            return `<span class="badge badge-danger">Pending</span>`;
            }

            return `<span class="badge bg-warning">Partial</span>`;
        }
        },
      {
        data: null,
        render: r => {
          const last = r.terms.filter(t => t.payment_date)
            .sort((a, b) => new Date(b.payment_date) - new Date(a.payment_date))[0];
          return last ? new Date(last.payment_date).toLocaleDateString() : "-";
        }
      }
    ]
  });

  /* =========================
     FILTER BUTTONS
  ========================= */
  $("#allCountBtn").click(() => {
    studentFeeFilters.payment_status = "";
    studentFeesTable.ajax.reload();
  });

  $("#paidCountBtn").click(() => {
    studentFeeFilters.payment_status = "paid";
    studentFeesTable.ajax.reload();
  });

  $("#pendingCountBtn").click(() => {
    studentFeeFilters.payment_status = "pending";
    studentFeesTable.ajax.reload();
  });

  $("#partialCountBtn").click(() => {
    studentFeeFilters.payment_status = "partial";
    studentFeesTable.ajax.reload();
  });

  /* =========================
     SEARCH (KEYUP)
  ========================= */
  let debounce;
  $("#studentSearch").on("keyup", function () {
    clearTimeout(debounce);
    const val = this.value;
    debounce = setTimeout(() => {
      studentFeeFilters.search = val;
      studentFeesTable.ajax.reload();
    }, 400);
  });

});
</script>


  </body>
</html>
